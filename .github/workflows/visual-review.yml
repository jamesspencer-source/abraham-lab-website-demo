name: Visual review

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      SITE_URL: ${{ format('https://{0}.github.io', github.repository_owner) }}
      SITE_BASE_PATH: ${{ format('/{0}', github.event.repository.name) }}

    steps:
      - name: Check out repository
        # Pinned to immutable action commit; update intentionally after review.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        # Pinned to immutable action commit; update intentionally after review.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build Astro site
        run: npm run build

      - name: Capture visual-review screenshots
        run: node scripts/visual-review.mjs

      - name: Run accessibility and browser review
        run: node scripts/quality-review.mjs

      - name: Upload visual review artifacts
        if: always()
        # Pinned to immutable action commit; update intentionally after review.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-review
          path: |
            output/visual-review
            output/quality-review
